# Lets maintainers ask Claude for help by mentioning @claude in an issue or
# pull request comment, e.g. "@claude review" on a community pull request,
# or "@claude implement this" on a feature request (Claude opens a branch
# and pull request for a human to review; it never merges).
#
# Only people with write access to the repository can trigger it; the
# action enforces this. Checks out the trusted default branch, never a
# fork's code. Uses the CLAUDE_CODE_OAUTH_TOKEN repository secret (a Claude
# Code subscription token); skipped if it isn't set.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip (CLAUDE_CODE_OAUTH_TOKEN not configured)
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Set the CLAUDE_CODE_OAUTH_TOKEN secret to enable Claude (see docs/development.md)."
      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --append-system-prompt "You are working on monoink. Follow the principles in README.md and docs/development.md: no sudo, no new data access without opt-in, Go code gofmt'd with tests, main.py standard-library only."
