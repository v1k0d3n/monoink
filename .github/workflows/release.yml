# Publishes a GitHub release with the Decky plugin zip when a version tag
# (e.g. v0.2.0) is pushed. The tag must match "version" in package.json.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Build and test (inside the Containerfile image)
        run: ./package.sh
        env:
          ENGINE: docker
      - name: Prepare assets
        run: |
          # Versioned name for people browsing releases, plus a fixed name so
          # .../releases/latest/download/monoink.zip always points at the
          # newest release (used by Decky's "Install Plugin from URL").
          cp out/monoink.zip "out/monoink-$GITHUB_REF_NAME.zip"
          (cd out && sha256sum "monoink-$GITHUB_REF_NAME.zip" > "monoink-$GITHUB_REF_NAME.zip.sha256")
          # Curated notes for this version, if any, go first.
          if [ -f "docs/release-notes/$GITHUB_REF_NAME.md" ]; then
            cp "docs/release-notes/$GITHUB_REF_NAME.md" out/notes.md
            printf '\n' >> out/notes.md
          fi
          cat >> out/notes.md <<EOF
          ## Install or update

          1. In Gaming Mode, open Quick Access (**⋯**) → **Decky** → ⚙ **Settings**, and turn on **Developer mode**.
          2. Decky → **Developer** → **Install Plugin from URL**:
             \`https://github.com/$GITHUB_REPOSITORY/releases/latest/download/monoink.zip\`
          3. Or download **monoink-$GITHUB_REF_NAME.zip** below and use **Install Plugin from ZIP File**.

          Updating keeps your settings. Full guide: [docs/install.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/install.md)
          EOF
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          # Only suffixed tags (v1.2.0-beta1) are pre-releases: GitHub's
          # releases/latest link (used for installs) skips pre-releases.
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "out/monoink-$GITHUB_REF_NAME.zip" "out/monoink-$GITHUB_REF_NAME.zip.sha256" out/monoink.zip \
            --title "monoink $GITHUB_REF_NAME" --notes-file out/notes.md --generate-notes $prerelease
