# Publishes a GitHub release with the Decky plugin zip when a version tag
# (e.g. v0.2.0) is pushed. The tag must match "version" in package.json.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Build and test (inside the Containerfile image)
        run: ./package.sh
        env:
          ENGINE: docker
      - name: Prepare assets
        run: |
          cp out/monoink.zip "out/monoink-$GITHUB_REF_NAME.zip"
          (cd out && sha256sum "monoink-$GITHUB_REF_NAME.zip" > "monoink-$GITHUB_REF_NAME.zip.sha256")
          cat > out/notes.md <<EOF
          ## Install or update

          1. In Gaming Mode, open Quick Access (**⋯**) → **Decky** → ⚙ **Settings**, and turn on **Developer mode**.
          2. Download **monoink-$GITHUB_REF_NAME.zip** below.
          3. Decky → **Developer** → **Install Plugin From ZIP File** → choose the zip.

          Updating keeps your settings. Full guide: [docs/install.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/install.md)
          EOF
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "out/monoink-$GITHUB_REF_NAME.zip" "out/monoink-$GITHUB_REF_NAME.zip.sha256" \
            --title "monoink $GITHUB_REF_NAME" --notes-file out/notes.md --generate-notes $prerelease
